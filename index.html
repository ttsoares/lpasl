    <meta charset="UTF-8" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Associação Software Livre.Org: desde 2003 promovendo o software livre no Brasil."
    />
    <meta name="theme-color" content="#FFFFFF" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Associação Software Livre.Org" />
    <meta property="og:title" content="ASL — Associação Software Livre.Org" />
    <meta
      property="og:description"
      content="Desde 2003, a ASL conecta pessoas, projetos e instituições que acreditam que o conhecimento deve ser compartilhado."
    />
    <meta property="og:image" content="https://asl.org.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Borboleta e dígitos binários da ASL ao lado do lema: Software livre é liberdade em movimento." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>ASL — Associação Software Livre.Org</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('asl-color-mode')
          var mode =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          document.documentElement.dataset.theme = mode
          document.documentElement.style.colorScheme = mode
        } catch (error) {
          /* storage can be unavailable; the React provider will decide */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
